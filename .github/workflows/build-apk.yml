name: build-apk
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
      - name: Generate Android shell if missing
        run: flutter create --platforms=android --org com.nineja --project-name nineja_transport .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: 9ja-transport-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
